<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Ductulator · Duct Calc</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="ductcalc.com" name="og:site_name">
    <meta content="Duct Calc" name="og:title">
    <meta content="Duct sizing based on ACCA, Manual-D." name="description">
    <meta content="Duct sizing based on ACCA, Manual-D." name="og:description">
    <meta content="/images/mand_logo.png" name="og:image">
    <meta content="/images/mand_logo.png" name="twitter:image">
    <meta content="Duct Calc" name="twitter:image:alt">
    <meta content="summary_large_image" name="twitter:card">
    <meta content="1536" name="og:image:width">
    <meta content="1024" name="og:image:height">
    <meta content="duct, hvac, duct-design, duct design, manual-d, manual d, design" name="keywords">
    <script src="https://unpkg.com/htmx.org@2.0.8"></script>
    <script src="/js/htmx-download.js"></script>
    <script src="/js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/css/output.css?v=navbar-reference-1">
    <link rel="stylesheet" href="/css/htmx.css">
    <link rel="stylesheet" href="/css/accessibility.css?v=1">
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/images/favicon-32x32.png" type="image/png">
    <link rel="icon" href="/images/favicon-16x16.png" type="image/png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <script src="https://unpkg.com/htmx-remove@latest" crossorigin="anonymous" integrity="sha384-NwB2Xh66PNEYfVki0ao13UAFmdNtMIdBKZ8sNGRT6hKfCPaINuZ4ScxS6vVAycPT"></script>
  </head>
  <body>
    <div class="flex flex-col min-h-screen min-w-full justify-between" data-theme="default">
      <a class="skip-link" href="#main-content">Skip to content</a>
      <main id="main-content" tabindex="-1" class="flex flex-col min-h-screen min-w-full grow mb-auto">
        <div>
          <nav class="app-navbar" aria-label="Main">
            <a class="app-brand" href="/">
            <img src="/images/mand_logo_sm.webp" alt="" width="48" height="48">
            Duct Calc<span></span></a>
            <div class="app-nav-actions"><a class="btn btn-outline btn-secondary" href="/fittings" target="_blank" title="Fitting reference, Ctrl+Alt+F" aria-keyshortcuts="Control+Alt+F"><span>Fitting reference</span></a></div>
          </nav>
          <div class="ductulator-shell">
            <div class="ductulator-panel">
              <div class="flex flex-wrap gap-3 items-center">
                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-calculator-icon lucide-calculator"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>
                <h1 class="text-3xl font-bold">Ductulator</h1>
              </div>
              <p class="font-bold italic">Calculate duct size for the given parameters</p>
              <form class="space-y-4 mt-6" hx-post="/ductulator" hx-target="#resultView" hx-swap="outerHTML">
                <label class="input w-full"><span class="label">CFM</span>
                <input name="cfm" type="number" placeholder="1000" required autofocus></label>
                <fieldset class="fieldset bg-base-200 border-base-300 rounded-box border-p-4 mt-2">
                  <legend class="fieldset-legend">Friction Rate</legend>
                  Value<label class="input w-full"><span class="label"></span>
                  <input name="frictionRate" value="0.06" required type="number" min="0.01" step="0.01" id="frictionRateInput" onchange="syncInputs('frictionRateSlider', 'frictionRateInput');"></label>
                  <input class="range range-sm range-accent w-full mt-3" type="range" min="0.00" max="0.2" step="0.01" value="0.06" id="frictionRateSlider" aria-label="Friction rate" onchange="syncInputs('frictionRateInput', 'frictionRateSlider');">
                  <div class="flex justify-between px-2.5 text-xs"><span>0.00</span><span>0.05</span><span>0.10</span><span>0.15</span><span>0.20</span></div>
                </fieldset>
                Height (inches, optional)<label class="input w-full"><span class="label"></span>
                <input name="height" type="number" placeholder="8"></label>
                <button class="btn btn-secondary btn-block mt-6" type="submit">Submit</button>
              </form>
              <div id="resultView"></div>
            </div>
          </div>
        </div>
      </main>
      <div id="app-status" class="sr-only" role="status" aria-atomic="true"></div>
      <div id="app-error" class="request-error" role="alert"></div>
      <div>
        <footer class="footer footer-horizontal footer-center
bg-base-300 text-base-content p-4">
          <div class="grid-flow-row items-center">
            <div class="flex mx-auto">
              <a class="btn btn-ghost" href="mailto:support@ductcalc.pro">  <svg aria-hidden="true" focusable="false" class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <g
                  stroke-linejoin="round"
                  stroke-linecap="round"
                  stroke-width="2.5"
                  fill="none"
                  stroke="currentColor"
                >
                  <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                </g>
              </svg><span>support@ductcalc.pro</span></a>
            </div>
            Source available via PolyForm Perimeter 1.0.1<a class="btn btn-ghost mx-auto" href="https://github.com/m-housh/swift-duct-calc/src/branch/main/LICENSE" target="_blank"><span></span></a>
            <p class="">Copyright © 2026 - All rights reserved by Michael Housh</p>
          </div>
        </footer>
      </div>
    </div>
  </body>
</html>
