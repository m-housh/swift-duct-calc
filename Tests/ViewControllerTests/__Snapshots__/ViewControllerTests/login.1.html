        <div class="auth-layout">
          <header class="auth-header">
            <a class="auth-brand" href="/"><span class="dc-wordmark" role="img" aria-label="DuctCalc, residential duct design"><span class="dc-wordmark-name" aria-hidden="true">
            <picture class="dc-wordmark-icon">
              <source media="(prefers-color-scheme: dark)" srcset="/images/brand/ductcalc-mark-dark.webp">

            C

          <section id="loginForm" class="auth-content" aria-labelledby="loginForm-title">
            <div class="auth-heading">
              <h1 id="loginForm-title">Welcome back</h1>
              <p>Log in to continue your duct designs.</p>
            </div>
            <form method="post" hx-post="/login" hx-target="body" hx-swap="outerHTML" class="auth-form">
              <div class="auth-field">
                <label for="email">Email</label>
                <input class="input validator" type="email" required name="email" id="email" autocomplete="username" autofocus>
              </div>
              <div class="auth-field">
                <label for="password">Password</label>
                <input class="input validator" type="password" required name="password" id="password" autocomplete="current-password">
              </div>
              <button type="submit" class="btn btn-primary auth-submit">Login</button>
              <p class="auth-switch"><span>New to DuctCalc? </span><a href="/signup">Create an account</a></p>
            </form>
          </section>
          <footer class="auth-footer"><a href="/privacy-policy" target="_blank">Privacy Policy</a><a href="mailto:support@ductcalc.pro">Contact Michael</a></footer>
        </div>
      </main>
      <div id="app-status" class="sr-only" role="status" aria-atomic="true"></div>
      <div id="app-error" class="request-error" role="alert"></div>
