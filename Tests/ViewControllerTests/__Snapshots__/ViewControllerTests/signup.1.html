<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Sign up · Duct Calc</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="ductcalc.com" name="og:site_name">
    <meta content="Duct Calc" name="og:title">
    <meta content="Duct sizing based on ACCA, Manual-D." name="description">
    <meta content="Duct sizing based on ACCA, Manual-D." name="og:description">
    <meta content="/images/mand_logo.png" name="og:image">
    <meta content="/images/mand_logo.png" name="twitter:image">
    <meta content="Duct Calc" name="twitter:image:alt">
    <meta content="summary_large_image" name="twitter:card">
    <meta content="1536" name="og:image:width">
    <meta content="1024" name="og:image:height">
    <meta content="duct, hvac, duct-design, duct design, manual-d, manual d, design" name="keywords">
    <script src="https://unpkg.com/htmx.org@2.0.8"></script>
    <script src="/js/htmx-download.js"></script>
    <script src="/js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/css/output.css?v=navbar-reference-1">
    <link rel="stylesheet" href="/css/htmx.css">
    <link rel="stylesheet" href="/css/accessibility.css?v=1">
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/images/favicon-32x32.png" type="image/png">
    <link rel="icon" href="/images/favicon-16x16.png" type="image/png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <script src="https://unpkg.com/htmx-remove@latest" crossorigin="anonymous" integrity="sha384-NwB2Xh66PNEYfVki0ao13UAFmdNtMIdBKZ8sNGRT6hKfCPaINuZ4ScxS6vVAycPT"></script>
  </head>
  <body>
    <div class="flex flex-col min-h-screen min-w-full justify-between" data-theme="default">
      <a class="skip-link" href="#main-content">Skip to content</a>
      <main id="main-content" tabindex="-1" class="flex flex-col min-h-screen min-w-full grow mb-auto">
        <section id="loginForm" class="page-form" aria-labelledby="loginForm-title">
          <h1 id="loginForm-title" class="text-2xl font-bold mb-6">Sign Up</h1>
          <div class="flex flex-wrap items-center justify-between gap-3"><a class="btn btn-link" href="/privacy-policy" target="_blank">Privacy Policy</a></div>
          <form method="post" class="space-y-4">
            <div>
              <label class="input validator w-full"><span class="label">Email</span>
              <input type="email" placeholder="Email" required name="email" id="email" autocomplete="username" autofocus></label>
              <div class="validator-hint hidden">Enter valid email address.</div>
            </div>
            <div>
              <label class="input validator w-full"><span class="label">Password</span>
              <input type="password" placeholder="Password" required pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" minlength="8" name="password" id="password" autocomplete="new-password" aria-describedby="password-help"></label>
            </div>
            <div>
              <label class="input validator w-full"><span class="label">Confirm password</span>
              <input type="password" placeholder="Confirm Password" required pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" minlength="8" name="confirmPassword" id="confirmPassword" autocomplete="new-password" aria-describedby="password-help"></label>
            </div>
            <p id="password-help" class="text-sm">Use at least 8 characters, including an uppercase letter, a lowercase letter, and a number.</p>
            <div class="flex">
              <button class="btn btn-secondary mt-4 w-full">Sign Up</button>
            </div>
            <div class="flex justify-center"><a class="btn btn-link" href="/login">Login</a></div>
          </form>
        </section>
      </main>
      <div id="app-status" class="sr-only" role="status" aria-atomic="true"></div>
      <div id="app-error" class="request-error" role="alert"></div>
      <div></div>
    </div>
  </body>
</html>
