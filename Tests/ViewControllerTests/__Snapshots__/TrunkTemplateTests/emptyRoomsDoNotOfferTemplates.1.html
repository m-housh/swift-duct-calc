<dialog id="trunkSizeForm" class="modal" aria-labelledby="trunkSizeForm-title">
  <div class="modal-box">
    <h2 id="trunkSizeForm-title" class="text-2xl font-bold mb-6 pe-10">Trunk / Runout Size</h2>
    <button type="button" class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2" aria-label="Close Trunk / Runout Size" onclick="this.closest('dialog').close()"><svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x-icon lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    <form data-success-message="Changes saved." class="space-y-4" hx-post="/projects/00000000-0000-0000-0000-000000000000/duct-sizing/trunk" hx-target="body" hx-swap="outerHTML">
      <input class="hidden" name="projectID" value="00000000-0000-0000-0000-000000000000">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <label class="select w-full"><span class="label">Type</span>
        <select name="type">
          <option value="supply">Supply</option>
          <option value="return">Return</option>
        </select>
        Height (in.)</label><label class="input w-full"><span class="label"></span>
        <input type="text" name="height" value="" placeholder="8 (Optional)"></label>
      </div>
      <p class="muted">Enter a height for rectangular sizing, or leave blank for round sizing.</p>
      Name<label class="input w-full"><span class="label"></span>
      <input type="text" name="name" value="" placeholder="Trunk-1" required></label>
      <fieldset class="checkbox-group">
        <legend class="font-bold">Associated Supply Runs</legend>
        <p>No supply runs available.</p>
      </fieldset>
      <button class="btn btn-secondary btn-block mt-6" type="submit">Submit</button>
    </form>
  </div>
</dialog>
