<title id="title">90° radius bend supplying a flex junction box — concept plan view</title><desc id="desc">Air enters a 90° radius bend from below, turns left through a straight inlet section, and supplies the junction box and its side-wall outlets. Subtle blue flow lines branch from the inlet to all four outlets; no outlet is selected. L measures spacing from the inlet wall to the first outlet nearest the entrance; the source calls for at least two duct diameters.</desc>
