<title id="title">Flex radius bend — concept drawing</title><desc id="desc">A round flexible duct turns 90 degrees. D is duct diameter, R is centerline bend radius, and the 90 degree construction guides extend the two opening faces to their intersection. Air flows up through the bend and exits to the left toward the junction box.</desc>
