<title id="title">Flex junction box — concept plan view</title><desc id="desc">One inlet on the right feeds side-wall outlets. Subtle blue flow lines branch from the inlet to all four outlets; no outlet is selected. L measures spacing from the inlet wall to the first outlet nearest the entrance; the source calls for at least two duct diameters.</desc>
