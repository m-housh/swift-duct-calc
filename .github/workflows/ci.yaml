name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  ubuntu:
    name: Linux Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: template_test
          POSTGRES_PASSWORD: local-test-password
          POSTGRES_DB: template_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U template_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
    - uses: actions/checkout@v4
    - name: Setup QEMU
      uses: docker/setup-qemu-action@v3
    - name: Setup buildx
      uses: docker/setup-buildx-action@v3 
    - name: Build test image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile.test
        push: false
        load: true
        tags: ${{ github.repository_owner }}/ductcalc:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Run Tests
      run: |
        docker run --rm -v ductcalc-build:/app/.build ${{ github.repository_owner }}/ductcalc:test swift test
    - name: Check concurrent template replacement on PostgreSQL
      # Run separately so the full parallel suite cannot starve the timed connection pools.
      run: |
        docker run --rm --network host -e TEMPLATE_TEST_POSTGRES_HOST=127.0.0.1 \
          -v ductcalc-build:/app/.build ${{ github.repository_owner }}/ductcalc:test \
          swift test --skip-build --filter ComponentLossTemplatePostgresTests
    - name: Check concurrent trunk names on PostgreSQL
      run: |
        docker run --rm --network host -e TRUNK_TEST_POSTGRES_HOST=127.0.0.1 \
          -v ductcalc-build:/app/.build ${{ github.repository_owner }}/ductcalc:test \
          swift test --skip-build --filter TrunkSizePostgresTests
    - name: Check trunk ordering on PostgreSQL
      run: |
        docker run --rm --network host -e TRUNK_TEST_POSTGRES_HOST=127.0.0.1 \
          -v ductcalc-build:/app/.build ${{ github.repository_owner }}/ductcalc:test \
          swift test --skip-build --filter TrunkOrderMigrationTests
    - name: Check equipment migration on PostgreSQL
      run: |
        docker run --rm --network host -e EQUIPMENT_TEST_POSTGRES_HOST=127.0.0.1 \
          -v ductcalc-build:/app/.build ${{ github.repository_owner }}/ductcalc:test \
          swift test --skip-build --filter EquipmentMigrationTests
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - run: npm ci
    - run: npm run test:project-shortcuts
    - run: npm run test:keybindings
    - run: npm run test:fitting-shortcuts
    - run: npm run test:equipment
    - run: npm run test:trunk-templates
    - run: npm run test:project-workspace
    - run: npm run test:file-import
    - run: npm run test:login-form
    - run: npx playwright install --with-deps chromium
    - run: npm run test:trunk-order
    - name: Start isolated accessibility test app
      run: |
        docker run --rm -d --name ductcalc-accessibility \
          -p 127.0.0.1:58681:8080 -e SQLITE_PATH=/tmp/accessibility.sqlite -e LOG_LEVEL=warning \
          -v ductcalc-build:/app/.build ${{ github.repository_owner }}/ductcalc:test \
          .build/debug/App serve --env development --hostname 0.0.0.0 --port 8080
        for attempt in $(seq 1 60); do
          if curl -fsS http://127.0.0.1:58681/ >/dev/null; then exit 0; fi
          sleep 1
        done
        docker logs ductcalc-accessibility
        exit 1
    - name: Check home page, themes, and accessibility
      run: DUCTCALC_HOME_ORIGIN=http://127.0.0.1:58681 npm run test:home-browser
    - name: Check request errors and retained drafts
      run: DUCTCALC_ERROR_ORIGIN=http://127.0.0.1:58681 npm run test:request-errors
    - name: Check account profile and navigation
      run: DUCTCALC_ACCOUNT_ORIGIN=http://127.0.0.1:58681 npm run test:account
    - name: Check customizable shortcuts and reveal mode
      run: DUCTCALC_KEYBINDINGS_ORIGIN=http://127.0.0.1:58681 npm run test:keybindings-browser
    - name: Check filter library and design preferences
      run: DUCTCALC_FILTER_ORIGIN=http://127.0.0.1:58681 npm run test:filters
    - name: Check accessibility and keyboard workflows
      run: npm run test:accessibility
    - name: Check fitting reference and shortcuts
      run: FITTING_APP_URL=http://127.0.0.1:58681 node scripts/check_fitting_reference_browser.cjs
    - name: Check fitting CSV import
      run: FITTING_APP_URL=http://127.0.0.1:58681 node scripts/check_fitting_csv_browser.cjs
    - name: Check path template workflows
      run: DUCT_TEMPLATE_QA_ORIGIN=http://127.0.0.1:58681 npm run test:path-templates
    - name: Check path template browser navigation
      run: DUCT_TEMPLATE_QA_ORIGIN=http://127.0.0.1:58681 node scripts/check_template_browse_browser.cjs
    - name: Check path template review and keyboard selection
      run: DUCT_TEMPLATE_QA_ORIGIN=http://127.0.0.1:58681 npm run test:path-template-review
    - name: Stop accessibility test app
      if: always()
      run: docker stop ductcalc-accessibility || true
