name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  ubuntu:
    name: Linux Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup QEMU
      uses: docker/setup-qemu-action@v3
    - name: Setup buildx
      uses: docker/setup-buildx-action@v3 
    - name: Build test image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile.test
        push: false
        load: true
        tags: ${{ github.repository_owner }}/ductcalc:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Run Tests
      run: |
        docker run --rm -v ductcalc-build:/app/.build ${{ github.repository_owner }}/ductcalc:test swift test
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - run: npm ci
    - run: npm run test:project-shortcuts
    - run: npm run test:fitting-shortcuts
    - run: npm run test:project-workspace
    - run: npm run test:login-form
    - run: npx playwright install --with-deps chromium
    - name: Start isolated accessibility test app
      run: |
        docker run --rm -d --name ductcalc-accessibility \
          -p 127.0.0.1:58681:8080 -e SQLITE_PATH=/tmp/accessibility.sqlite -e LOG_LEVEL=warning \
          -v ductcalc-build:/app/.build ${{ github.repository_owner }}/ductcalc:test \
          .build/debug/App serve --env development --hostname 0.0.0.0 --port 8080
        for attempt in $(seq 1 60); do
          if curl -fsS http://127.0.0.1:58681/ >/dev/null; then exit 0; fi
          sleep 1
        done
        docker logs ductcalc-accessibility
        exit 1
    - name: Check accessibility and keyboard workflows
      run: npm run test:accessibility
    - name: Check fitting reference and shortcuts
      run: FITTING_APP_URL=http://127.0.0.1:58681 node scripts/check_fitting_reference_browser.cjs
    - name: Stop accessibility test app
      if: always()
      run: docker stop ductcalc-accessibility || true
