services:
  db:
    image: docker.io/postgres:18
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  ductcalc:
    image: ${DUCTCALC_IMAGE:-ghcr.io/m-housh/ductcalc:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${DUCTCALC_BIND_ADDRESS:-0.0.0.0}:${DUCTCALC_PORT:-8080}:8080"
    healthcheck:
      test: curl --fail --silent http://0.0.0.0:8080/health || exit 1
      interval: 1m
      timeout: 10s
      retries: 3
